version: '3.8'

services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: mplads_backend
    restart: always
    environment:
      - PORT=8000
    expose:
      - "8000"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - mplads_net

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: mplads_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - mplads_net

networks:
  mplads_net:
    driver: bridge
