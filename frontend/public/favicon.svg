<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <!-- Outer Rounded Shield / Badge Background -->
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Background Shield -->
  <rect x="2" y="2" width="44" height="44" rx="10" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="1.8"/>
  
  <!-- Subtle Inner Ring -->
  <circle cx="24" cy="24" r="18.5" stroke="url(#goldGrad)" stroke-width="0.8" stroke-dasharray="2 1.5" opacity="0.6"/>

  <!-- Stylized Chakra / Radar Ring -->
  <g transform="translate(24, 24)" stroke="url(#goldGrad)" stroke-linecap="round">
    <circle cx="0" cy="0" r="14.5" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.9"/>
    
    <!-- 8 spokes -->
    <line x1="0" y1="-14" x2="0" y2="14" stroke-width="0.8" opacity="0.6"/>
    <line x1="-14" y1="0" x2="14" y2="0" stroke-width="0.8" opacity="0.6"/>
    <line x1="-10" y1="-10" x2="10" y2="10" stroke-width="0.8" opacity="0.6"/>
    <line x1="-10" y1="10" x2="10" y2="-10" stroke-width="0.8" opacity="0.6"/>
  </g>

  <!-- Central Government Dome & Pillars Motif -->
  <!-- Base -->
  <path d="M14 32.5h20v2.2H14z" fill="url(#goldGrad)"/>
  <path d="M15.5 30.5h17v1.5H15.5z" fill="#FFF" opacity="0.95"/>

  <!-- Pillars -->
  <path d="M16.5 21.5h2v8.5h-2z" fill="url(#goldGrad)"/>
  <path d="M21 21.5h2v8.5h-2z" fill="#FFF" opacity="0.95"/>
  <path d="M25 21.5h2v8.5h-2z" fill="#FFF" opacity="0.95"/>
  <path d="M29.5 21.5h2v8.5h-2z" fill="url(#goldGrad)"/>

  <!-- Architrave -->
  <path d="M15 19.5h18v1.6H15z" fill="url(#goldGrad)"/>

  <!-- Dome -->
  <path d="M18.5 19.5 C18.5 14.5 29.5 14.5 29.5 19.5 Z" fill="url(#goldGrad)"/>
  <circle cx="24" cy="12" r="1.5" fill="#FDE68A"/>

  <!-- AI Pulse nodes -->
  <circle cx="9" cy="9" r="2.2" fill="#10B981"/>
  <circle cx="39" cy="9" r="2.2" fill="#F59E0B"/>
</svg>