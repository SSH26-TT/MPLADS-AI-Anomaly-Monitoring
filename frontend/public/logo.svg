<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <!-- Outer Rounded Shield / Badge Background -->
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Shield -->
  <rect x="2" y="2" width="44" height="44" rx="11" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="1.5" filter="url(#shadowFilter)"/>
  
  <!-- Subtle Inner Ring -->
  <circle cx="24" cy="24" r="18.5" stroke="url(#goldGrad)" stroke-width="0.75" stroke-dasharray="2 1.5" opacity="0.6"/>

  <!-- Stylized Ashoka Chakra / Radar Core (Outer Ring with 24 Spokes) -->
  <g transform="translate(24, 24)" stroke="url(#goldGrad)" stroke-linecap="round">
    <circle cx="0" cy="0" r="14.5" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.9"/>
    
    <!-- 12 Spoke lines (24 rays) -->
    <line x1="0" y1="-14" x2="0" y2="14" stroke-width="0.75" opacity="0.5"/>
    <line x1="-14" y1="0" x2="14" y2="0" stroke-width="0.75" opacity="0.5"/>
    <line x1="-9.9" y1="-9.9" x2="9.9" y2="9.9" stroke-width="0.75" opacity="0.5"/>
    <line x1="-9.9" y1="9.9" x2="9.9" y2="-9.9" stroke-width="0.75" opacity="0.5"/>
    <line x1="-5.36" y1="-12.95" x2="5.36" y2="12.95" stroke-width="0.6" opacity="0.35"/>
    <line x1="5.36" y1="-12.95" x2="-5.36" y2="12.95" stroke-width="0.6" opacity="0.35"/>
    <line x1="-12.95" y1="-5.36" x2="12.95" y2="5.36" stroke-width="0.6" opacity="0.35"/>
    <line x1="12.95" y1="-5.36" x2="-12.95" y2="5.36" stroke-width="0.6" opacity="0.35"/>
  </g>

  <!-- Central Government / Parliament Dome & Pillars Emblem Motif -->
  <!-- Base Plinth -->
  <path d="M14 32.5h20v2.2H14z" fill="url(#goldGrad)"/>
  <path d="M15.5 30.5h17v1.5H15.5z" fill="#FFF" opacity="0.9"/>

  <!-- Pillars (4 pillars) -->
  <path d="M16.5 21.5h1.8v8.5h-1.8z" fill="url(#goldGrad)"/>
  <path d="M21.1 21.5h1.8v8.5h-1.8z" fill="#FFF" opacity="0.95"/>
  <path d="M25.1 21.5h1.8v8.5h-1.8z" fill="#FFF" opacity="0.95"/>
  <path d="M29.7 21.5h1.8v8.5h-1.8z" fill="url(#goldGrad)"/>

  <!-- Architrave / Top Beam -->
  <path d="M15 19.5h18v1.6H15z" fill="url(#goldGrad)"/>

  <!-- Central Dome -->
  <path d="M18.5 19.5 C18.5 14.5 29.5 14.5 29.5 19.5 Z" fill="url(#goldGrad)"/>
  
  <!-- Crown / Finial on top of dome -->
  <line x1="24" y1="12" x2="24" y2="14.5" stroke="url(#goldGrad)" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="24" cy="11.5" r="1.2" fill="#FDE68A"/>

  <!-- AI Pulse / Audit Nodes on corners -->
  <circle cx="10" cy="10" r="1.8" fill="#10B981"/>
  <circle cx="38" cy="10" r="1.8" fill="#F59E0B"/>
  <circle cx="10" cy="38" r="1.5" fill="#3B82F6" opacity="0.7"/>
  <circle cx="38" cy="38" r="1.5" fill="#10B981" opacity="0.7"/>
</svg>
