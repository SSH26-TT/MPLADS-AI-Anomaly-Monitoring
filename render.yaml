services:
  - type: web
    name: mplads-ai-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt && python backend/scripts/import_data.py
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
